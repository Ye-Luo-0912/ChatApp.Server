name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CHATAPP_TEST_GARNET: "127.0.0.1:6379,abortConnect=false"
      CHATAPP_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Database=ChatAppDatabase;Username=postgres;Password=postgres"
      ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=ChatAppDatabase;Username=postgres;Password=postgres"
      ConnectionStrings__Garnet: "127.0.0.1:6379,abortConnect=false"
      JwtSettings__Issuer: ChatApp
      JwtSettings__Audience: ChatApp
      ForwardedHeaders__KnownProxies__0: "127.0.0.1"
      ForwardedHeaders__KnownNetworks__0: "172.28.0.0/16"

    steps:
      - name: Checkout Server
        uses: actions/checkout@v4
        with:
          path: ChatApp.Server

      # P0-7: 从 Realtime.version 读取固定 commit，确保同一 Server commit 编译到相同版本的 Realtime 代码。
      - name: Read pinned Realtime version
        id: realtime-version
        run: |
          commit=$(grep "^Commit=" ChatApp.Server/Realtime.version | cut -d= -f2)
          repo_raw=$(grep "^Repo=" ChatApp.Server/Realtime.version | cut -d= -f2)
          # actions/checkout 需要 owner/repo 格式；Realtime.version 可能存完整 URL
          repo=$(echo "$repo_raw" | sed -E 's#^https?://[^/]+/##; s#\.git$##')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Checkout RealtimeServices at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.realtime-version.outputs.repo }}
          path: ChatApp.RealtimeServices
          ref: ${{ steps.realtime-version.outputs.commit }}

      - name: Verify Realtime commit matches lock file
        run: |
          actual=$(git -C ChatApp.RealtimeServices rev-parse HEAD)
          expected="${{ steps.realtime-version.outputs.commit }}"
          if [ "$actual" != "$expected" ]; then
            echo "Realtime commit mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          echo "OK: Realtime at pinned commit $expected"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start Postgres
        run: |
          docker run -d --name chatapp_postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ChatAppDatabase \
            -p 5432:5432 postgres:16.8
          for i in $(seq 1 30); do
            docker exec chatapp_postgres pg_isready -U postgres -d ChatAppDatabase && break
            sleep 2
          done

      # P0-6: 使用真实 Garnet 1.0.84（而非 redis:7.2）运行集成测试，
      # 验证 Lua 脚本在 --lua-transaction-mode 下的原子性契约。
      # compose gate 仍独立验证带 AOF/持久化的完整生产配置。
      - name: Start Garnet (real Garnet 1.0.84 with --lua-transaction-mode)
        run: |
          docker rm -f chatapp_garnet || true
          docker run -d --name chatapp_garnet -p 6379:6379 --user 0:0 \
            ghcr.io/microsoft/garnet:1.0.84 \
            --bind 0.0.0.0 --port 6379 --lua --lua-transaction-mode
          for i in $(seq 1 15); do
            if docker exec chatapp_garnet bash -c 'echo > /dev/tcp/127.0.0.1/6379' 2>/dev/null; then
              echo "Garnet is ready"
              break
            fi
            sleep 1
          done

      - name: Release build
        working-directory: ChatApp.Server
        run: dotnet build ChatApp.Server.sln -c Release

      - name: Verify Realtime Release DLLs
        working-directory: ChatApp.Server
        run: |
          set -e
          integration_dll=$(find ../ChatApp.RealtimeServices -path '*/bin/Release/*/ChatApp.Realtime.Integration.dll' | head -n 1)
          abstractions_dll=$(find ../ChatApp.RealtimeServices -path '*/bin/Release/*/ChatApp.Realtime.Abstractions.dll' | head -n 1)
          test -n "$integration_dll" && test -f "$integration_dll"
          test -n "$abstractions_dll" && test -f "$abstractions_dll"
          # Release 构建不得只留下 Debug 产物作为最终引用
          debug_integration=$(find ../ChatApp.RealtimeServices -path '*/bin/Debug/*/ChatApp.Realtime.Integration.dll' -newer "$integration_dll" 2>/dev/null | head -n 1 || true)
          if [ -n "$debug_integration" ]; then
            echo "Release build updated Debug Realtime DLL: $debug_integration" >&2
            exit 1
          fi
          echo "OK: $integration_dll"
          echo "OK: $abstractions_dll"

      - name: Apply migrations
        working-directory: ChatApp.Server
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.* || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project Infrastructure --startup-project Infrastructure --context UserDbContext

      - name: Health ready gate
        working-directory: ChatApp.Server
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5088
          ConnectionStrings__DefaultConnection: ${{ env.CHATAPP_TEST_POSTGRES }}
          ConnectionStrings__Garnet: ${{ env.CHATAPP_TEST_GARNET }}
          JwtSettings__Issuer: ChatApp
          JwtSettings__Audience: ChatApp
          JwtSettings__Secret: ci-test-secret-please-change-32chars
          Security__SecretEncryptionKey: ci-test-secret-encryption-key-32-chars!!
          EmailSettings__Host: localhost
          EmailSettings__SenderEmail: noreply@localhost
          EmailSettings__Password: dummy
          ForwardedHeaders__KnownProxies__0: 127.0.0.1
          ForwardedHeaders__KnownNetworks__0: 172.28.0.0/16
        run: |
          set -e
          dotnet run --project ChatApp.Server.csproj -c Release --no-build &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:5088/health/ready"; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"

      - name: Test
        working-directory: ChatApp.Server
        timeout-minutes: 5
        run: |
          dotnet test tests/ChatApp.Server.IntegrationTests/ChatApp.Server.IntegrationTests.csproj -c Release

      - name: Compose ready gate
        working-directory: ChatApp.Server
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ChatAppDatabase
          JwtSettings__Secret: ci-compose-secret-please-change-32chars
          JwtSettings__Issuer: ChatApp
          JwtSettings__Audience: ChatApp
        run: |
          set -euo pipefail
          # 释放 standalone 容器名（chatapp_postgres / chatapp_garnet），避免与 compose 的 container_name 冲突
          docker rm -f chatapp_postgres chatapp_garnet 2>/dev/null || true
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=postgres
          POSTGRES_USER=postgres
          POSTGRES_DB=ChatAppDatabase
          JwtSettings__Secret=ci-compose-secret-please-change-32chars
          JwtSettings__Issuer=ChatApp
          JwtSettings__Audience=ChatApp
          Security__SecretEncryptionKey=ci-compose-encryption-key-32-chars!!
          EmailSettings__Host=localhost
          EmailSettings__SenderEmail=noreply@localhost
          EmailSettings__Password=dummy
          CHATAPP_PROXY_PORT=18080
          EOF
          docker compose -f docker-compose.yaml up -d --build
          ok=0
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' chatapp_api 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then
              if curl -fsS "http://127.0.0.1:18080/health/ready"; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          docker compose -f docker-compose.yaml logs --no-color || true
          docker compose -f docker-compose.yaml down -v || true
          test "$ok" = "1"

      - name: Docker build
        working-directory: ChatApp.Server
        run: docker build -f Dockerfile -t chatapp-server:ci ..

      - name: Dependency vulnerability check
        working-directory: ChatApp.Server
        run: |
          set +e
          out=$(dotnet list ChatApp.Server.sln package --vulnerable --include-transitive 2>&1)
          echo "$out"
          echo "$out" | grep -qiE "Critical|High" && exit 1 || exit 0
