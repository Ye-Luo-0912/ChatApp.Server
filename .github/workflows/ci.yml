name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      CHATAPP_TEST_GARNET: "127.0.0.1:6379,abortConnect=false"
      CHATAPP_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Database=ChatAppDatabase;Username=postgres;Password=postgres"
      ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=ChatAppDatabase;Username=postgres;Password=postgres"
      ConnectionStrings__Garnet: "127.0.0.1:6379,abortConnect=false"
      JwtSettings__Issuer: ChatApp
      JwtSettings__Audience: ChatApp
      ForwardedHeaders__KnownProxies__0: "127.0.0.1"
      ForwardedHeaders__KnownNetworks__0: "172.28.0.0/16"

    steps:
      - name: Checkout Server
        uses: actions/checkout@v4
        with:
          path: ChatApp.Server

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start Postgres
        run: |
          docker run -d --name chatapp_postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ChatAppDatabase \
            -p 5432:5432 postgres:16.8
          for i in $(seq 1 30); do
            docker exec chatapp_postgres pg_isready -U postgres -d ChatAppDatabase && break
            sleep 2
          done

      # P0-6: 使用真实 Garnet 1.0.84（而非 redis:7.2）运行集成测试，
      # 验证 Lua 脚本在 --lua-transaction-mode 下的原子性契约。
      # compose gate 仍独立验证带 AOF/持久化的完整生产配置。
      - name: Start Garnet (real Garnet 1.0.84 with --lua-transaction-mode)
        run: |
          docker rm -f chatapp_garnet || true
          docker run -d --name chatapp_garnet -p 6379:6379 --user 0:0 \
            ghcr.io/microsoft/garnet:1.0.84 \
            --bind 0.0.0.0 --port 6379 --lua --lua-transaction-mode
          for i in $(seq 1 15); do
            if docker exec chatapp_garnet bash -c 'echo > /dev/tcp/127.0.0.1/6379' 2>/dev/null; then
              echo "Garnet is ready"
              break
            fi
            sleep 1
          done

      - name: Start ClamAV integration dependency
        run: |
          docker rm -f chatapp_clamav 2>/dev/null || true
          docker run -d --name chatapp_clamav -p 3310:3310 clamav/clamav:1.4
          for i in $(seq 1 120); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/3310' 2>/dev/null; then
              echo "ClamAV is accepting connections"
              break
            fi
            sleep 2
          done
          bash -c 'echo > /dev/tcp/127.0.0.1/3310' 2>/dev/null

      - name: Start MinIO S3 integration dependency
        run: |
          docker rm -f chatapp_minio 2>/dev/null || true
          docker run -d --name chatapp_minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            -e MINIO_KMS_SECRET_KEY=minio-key:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            minio/minio:RELEASE.2024-12-18T13-15-44Z \
            server /data --console-address :9001
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null

      - name: Locked restore
        working-directory: ChatApp.Server
        run: dotnet restore ChatApp.Server.sln --locked-mode

      - name: Release build
        working-directory: ChatApp.Server
        run: dotnet build ChatApp.Server.sln -c Release --no-restore

      - name: Apply migrations
        working-directory: ChatApp.Server
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.* || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project Infrastructure --startup-project Infrastructure --context UserDbContext

      - name: Health ready gate
        working-directory: ChatApp.Server
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://127.0.0.1:5088
          ConnectionStrings__DefaultConnection: ${{ env.CHATAPP_TEST_POSTGRES }}
          ConnectionStrings__Garnet: ${{ env.CHATAPP_TEST_GARNET }}
          JwtSettings__Issuer: ChatApp
          JwtSettings__Audience: ChatApp
          JwtSettings__Secret: ci-test-secret-please-change-32chars
          Security__SecretEncryptionKey: ci-test-secret-encryption-key-32-chars!!
          EmailSettings__Host: localhost
          EmailSettings__SenderEmail: noreply@localhost
          EmailSettings__Password: dummy
          ForwardedHeaders__KnownProxies__0: 127.0.0.1
          ForwardedHeaders__KnownNetworks__0: 172.28.0.0/16
        run: |
          set -e
          dotnet run --project ChatApp.Server.csproj -c Release --no-build &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:5088/health/ready"; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"

      - name: Test
        working-directory: ChatApp.Server
        timeout-minutes: 5
        run: |
          dotnet test tests/ChatApp.Server.IntegrationTests/ChatApp.Server.IntegrationTests.csproj \
            -c Release --no-build --no-restore

      - name: ClamAV integration gate
        working-directory: ChatApp.Server
        env:
          CHATAPP_TEST_CLAMAV: "127.0.0.1:3310"
        run: |
          dotnet test tests/ChatApp.Server.IntegrationTests/ChatApp.Server.IntegrationTests.csproj \
            -c Release --no-build --filter "Category=ClamAV"

      - name: MinIO S3 failure-injection gate
        working-directory: ChatApp.Server
        env:
          CHATAPP_TEST_MINIO_ENDPOINT: "http://127.0.0.1:9000"
          CHATAPP_TEST_MINIO_BUCKET: "chatapp-integration"
          CHATAPP_TEST_MINIO_DOCKER_RESTART: "1"
          AWS_ACCESS_KEY_ID: "minioadmin"
          AWS_SECRET_ACCESS_KEY: "minioadmin123"
        run: |
          dotnet test tests/ChatApp.Server.IntegrationTests/ChatApp.Server.IntegrationTests.csproj \
            -c Release --no-build --filter "Category=MinIO"

      - name: Compose ready gate
        working-directory: ChatApp.Server
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ChatAppDatabase
          JwtSettings__Secret: ci-compose-secret-please-change-32chars
          JwtSettings__Issuer: ChatApp
          JwtSettings__Audience: ChatApp
        run: |
          set -euo pipefail
          # 释放 standalone 容器名（chatapp_postgres / chatapp_garnet），避免与 compose 的 container_name 冲突
          docker rm -f chatapp_postgres chatapp_garnet 2>/dev/null || true
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=postgres
          POSTGRES_USER=postgres
          POSTGRES_DB=ChatAppDatabase
          JwtSettings__Secret=ci-compose-secret-please-change-32chars
          ASPNETCORE_ENVIRONMENT=Testing
          JwtSettings__Issuer=ChatApp
          JwtSettings__Audience=ChatApp
          Security__SecretEncryptionKey=ci-compose-encryption-key-32-chars!!
          EmailSettings__Host=localhost
          EmailSettings__SenderEmail=noreply@localhost
          EmailSettings__Password=dummy
          CHATAPP_PROXY_PORT=18080
          EOF
          docker compose -f docker-compose.yaml up -d --build
          ok=0
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' chatapp_api 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then
              if curl -fsS "http://127.0.0.1:18080/health/ready"; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          docker compose -f docker-compose.yaml logs --no-color || true
          docker compose -f docker-compose.yaml down -v || true
          test "$ok" = "1"

      - name: Docker build
        working-directory: ChatApp.Server
        run: docker build -f Dockerfile -t chatapp-server:ci .

      - name: Dependency vulnerability check
        working-directory: ChatApp.Server
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/dependency-vulnerabilities.json"
          set +e
          dotnet list ChatApp.Server.sln package --vulnerable --include-transitive --format json >"$report"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "dotnet list package failed with exit code $status" >&2
            cat "$report" >&2 || true
            exit "$status"
          fi

          if ! jq empty "$report"; then
            echo "dotnet list package returned invalid JSON" >&2
            cat "$report" >&2
            exit 1
          fi
          cat "$report"

          vulnerability_query='[
            .projects[]?.frameworks[]?
            | ((.topLevelPackages // []) + (.transitivePackages // []))[]?
            | .vulnerabilities[]?
            | select(((.severity // "") | tostring | ascii_downcase) == "high"
                     or ((.severity // "") | tostring | ascii_downcase) == "critical")
          ]'
          if jq -e "$vulnerability_query | length > 0" "$report" >/dev/null; then
            echo "High/Critical dependency vulnerability found" >&2
            jq "$vulnerability_query" "$report" >&2
            exit 1
          fi

      - name: Cleanup external integration dependencies
        if: always()
        run: docker rm -f chatapp_clamav chatapp_minio 2>/dev/null || true

  garnet-compatibility:
    name: Garnet compatibility contracts
    runs-on: ubuntu-latest
    needs: build-test
    env:
      CHATAPP_TEST_GARNET: "127.0.0.1:6379,abortConnect=false"
      CHATAPP_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Database=ChatAppDatabase;Username=postgres;Password=postgres"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout Server
        uses: actions/checkout@v4
        with:
          path: ChatApp.Server

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start Garnet with production Lua transaction mode
        run: |
          docker run -d --name chatapp_garnet -p 6379:6379 --user 0:0 \
            ghcr.io/microsoft/garnet:1.0.84 \
            --bind 0.0.0.0 --port 6379 --lua --lua-transaction-mode \
            --checkpointdir /data/checkpoints --aof --aof-size-limit 64m --recover
          for i in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/6379' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs chatapp_garnet || true
          exit 1

      - name: Start Postgres for cross-store contracts
        run: |
          docker run -d --name chatapp_postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=ChatAppDatabase \
            -p 5432:5432 postgres:16.8
          for i in $(seq 1 30); do
            if docker exec chatapp_postgres pg_isready -U postgres -d ChatAppDatabase; then
              exit 0
            fi
            sleep 2
          done
          docker logs chatapp_postgres || true
          exit 1

      - name: Locked restore
        working-directory: ChatApp.Server
        run: dotnet restore ChatApp.Server.sln --locked-mode

      - name: Release build
        working-directory: ChatApp.Server
        run: dotnet build ChatApp.Server.sln -c Release --no-restore

      - name: Run full integration suite against Garnet
        working-directory: ChatApp.Server
        run: |
          dotnet test tests/ChatApp.Server.IntegrationTests/ChatApp.Server.IntegrationTests.csproj \
            -c Release --no-build --no-restore

      # This test deliberately restarts the shared Garnet container. Keep it in a
      # separate test process so it cannot sever another contract's Redis transaction.
      - name: Run Garnet restart recovery contract exclusively
        working-directory: ChatApp.Server
        env:
          CHATAPP_TEST_GARNET_DOCKER_RESTART: "1"
        run: dotnet test tests/ChatApp.Server.IntegrationTests/ChatApp.Server.IntegrationTests.csproj -c Release --no-build --filter "FullyQualifiedName=ChatApp.Server.IntegrationTests.Caching.GarnetRestartRecoveryTests.ValueSurvivesGarnetContainerRestart"
