name: Performance Regression (PR)

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# 避免同一 PR 多次推送并发跑压测
concurrency:
  group: perf-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # 固定 runner 镜像，避免 ubuntu-latest 漂移污染性能基线。
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__DefaultConnection: "Host=127.0.0.1;Port=5432;Database=ChatAppDatabase;Username=postgres;Password=postgres;Pooling=true"
      ConnectionStrings__Garnet: "127.0.0.1:6379,abortConnect=false"
      JwtSettings__Issuer: ChatApp
      JwtSettings__Audience: ChatApp
      JwtSettings__Secret: perf-ci-secret-please-change-32chars-min
      ForwardedHeaders__KnownProxies__0: "127.0.0.1"
      ForwardedHeaders__KnownNetworks__0: "172.28.0.0/16"
      Security__SecretEncryptionKey: "perf-ci-secret-encryption-key-32-chars!!"
      EmailSettings__Host: "localhost"
      EmailSettings__SenderEmail: "noreply@localhost"
      EmailSettings__Password: "dummy"
      ASPNETCORE_ENVIRONMENT: "Performance"
      ASPNETCORE_URLS: "http://127.0.0.1:5088"

    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ChatAppDatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ChatAppDatabase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Server
        uses: actions/checkout@v4
        with:
          path: ChatApp.Server

      - name: Read pinned Realtime version
        id: realtime-version
        working-directory: ChatApp.Server
        run: |
          commit=$(grep "^Commit=" Realtime.version | cut -d= -f2)
          repo_raw=$(grep "^Repo=" Realtime.version | cut -d= -f2)
          # actions/checkout 需要 owner/repo 格式；Realtime.version 可能存完整 URL
          repo=$(echo "$repo_raw" | sed -E 's#^https?://[^/]+/##; s#\.git$##')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Checkout RealtimeServices at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.realtime-version.outputs.repo }}
          path: ChatApp.RealtimeServices
          ref: ${{ steps.realtime-version.outputs.commit }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup k6
        uses: grafana/k6-action@v0.3.1
        with:
          k6-version: "0.54.0"

      - name: Start Garnet with Lua scripting
        run: |
          docker run -d --name garnet -p 6379:6379 --user 0:0 \
            ghcr.io/microsoft/garnet:1.0.84 \
            --bind 0.0.0.0 --port 6379 --lua
          for i in $(seq 1 30); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/6379' 2>/dev/null; then
              echo "Garnet ready"
              exit 0
            fi
            sleep 1
          done
          echo "Garnet failed to start"
          exit 1

      - name: Release build
        working-directory: ChatApp.Server
        run: dotnet build ChatApp.Server.sln -c Release

      - name: Apply migrations
        working-directory: ChatApp.Server
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.* || true
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet ef database update --project Infrastructure --startup-project Infrastructure --context UserDbContext

      - name: Seed test users
        working-directory: ChatApp.Server
        env:
          USE_DOCKER: "1"
          SEED_COUNT: "60"
          TEST_USER_PREFIX: "loaduser"
          PGUSER: "postgres"
          PGDATABASE: "ChatAppDatabase"
        run: bash tests/load/seed-users.sh

      - name: Start API (Performance env)
        working-directory: ChatApp.Server
        run: |
          dotnet run --project ChatApp.Server.csproj -c Release --no-build --no-launch-profile &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:5088/health/ready" > /dev/null 2>&1; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready"
          exit 1

      - name: Generate preset tokens
        working-directory: ChatApp.Server/tests/load
        run: |
          node -e '
            const http = require("http");
            const tokens = [];
            let done = 0;
            const total = 50;
            for (let i = 1; i <= total; i++) {
              const data = JSON.stringify({ username: "loaduser" + i, password: "Passw0rd!" });
              const req = http.request({
                hostname: "127.0.0.1", port: 5088, path: "/api/auth/login", method: "POST",
                headers: { "Content-Type": "application/json", "X-Device-Id": "seed-" + i, "Content-Length": Buffer.byteLength(data) }
              }, (res) => {
                let body = "";
                res.on("data", (c) => body += c);
                res.on("end", () => {
                  try {
                    const j = JSON.parse(body);
                    if (res.statusCode === 200 && j.accessToken) {
                      const idMatch = body.match(/"userId"\s*:\s*(\d+)/i);
                      tokens.push({ accessToken: j.accessToken, refreshToken: j.refreshToken || "", userId: idMatch ? Number(idMatch[1]) : 0 });
                    }
                  } catch (e) {}
                  if (++done === total) {
                    require("fs").writeFileSync("tokens.json", JSON.stringify(tokens));
                    console.log("Generated " + tokens.length + " tokens");
                    process.exit(tokens.length >= 40 ? 0 : 1);
                  }
                });
              });
              req.on("error", () => { if (++done === total) { require("fs").writeFileSync("tokens.json", "[]"); process.exit(1); } });
              req.write(data);
              req.end();
            }
          '

      - name: Warmup run (90s)
        working-directory: ChatApp.Server/tests/load
        run: |
          k6 run -e BASE_URL=http://127.0.0.1:5088 -e TOKENS_FILE=./tokens.json \
            -e PROFILE=steady -e RATE=10 -e DURATION=90s \
            tests/load/mixed-workload.k6.js > /tmp/warmup.log 2>&1 || true
          echo "--- warmup 完成 ---"
          tail -n 5 /tmp/warmup.log || true

      - name: Measured run (3m)
        working-directory: ChatApp.Server/tests/load
        run: |
          k6 run -e BASE_URL=http://127.0.0.1:5088 -e TOKENS_FILE=./tokens.json \
            -e PROFILE=steady -e RATE=20 -e DURATION=3m \
            --out json=current.json \
            tests/load/mixed-workload.k6.js

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/api.pid ]; then
            kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          fi

      - name: Detect baseline
        id: baseline
        working-directory: ChatApp.Server/tests/load
        run: |
          BASELINE="baselines/baseline-steady-rate20.json"
          if [ -f "$BASELINE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "path=$BASELINE" >> "$GITHUB_OUTPUT"
            echo "找到基线: $BASELINE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::error::未找到基线 $BASELINE。Nightly workflow 负责生成基线；请先手动触发 Performance Nightly workflow_dispatch 生成基线后再提 PR。"
            exit 1
          fi

      - name: Compare against baseline
        working-directory: ChatApp.Server/tests/load
        run: |
          node compare-baseline.mjs \
            --baseline "${{ steps.baseline.outputs.path }}" \
            --current current.json \
            --absolute absolute-goals.json \
            --strict

      - name: Upload current run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-current-${{ github.run_id }}
          path: ChatApp.Server/tests/load/current.json
          retention-days: 30
