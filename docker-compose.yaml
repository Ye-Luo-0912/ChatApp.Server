services:
  postgres_db:
    image: postgres:16.8
    container_name: chatapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ChatAppDatabase}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp_net

  garnet_cache:
    image: ghcr.io/microsoft/garnet:1.0.84
    container_name: chatapp_garnet
    restart: unless-stopped
    user: "0:0"
    command:
      - "--bind"
      - "0.0.0.0"
      - "--port"
      - "6379"
      - "--checkpointdir"
      - "/data/checkpoints"
      - "--aof"
      - "--aof-size-limit"
      - "64m"
      - "--recover"
      - "--lua"
      - "--lua-transaction-mode"
    expose:
      - "6379"
    volumes:
      - garnet_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6379' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp_net

  migrate:
    build:
      context: ..
      dockerfile: ChatApp.Server/Dockerfile
    container_name: chatapp_migrate
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-ChatAppDatabase};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Pooling=true
      ConnectionStrings__Garnet: garnet_cache:6379,abortConnect=false
      Security__SecretEncryptionKey: ${Security__SecretEncryptionKey:?Set Security__SecretEncryptionKey}
      JwtSettings__Issuer: ChatApp
      JwtSettings__Audience: ChatApp
      ForwardedHeaders__KnownNetworks__0: 172.28.0.0/16
      ForwardedHeaders__KnownProxies__0: 127.0.0.1
    command: ["dotnet", "ChatApp.Server.dll", "--migrate"]
    depends_on:
      postgres_db:
        condition: service_healthy
      garnet_cache:
        condition: service_healthy
    restart: "no"
    networks:
      - chatapp_net

  api:
    build:
      context: ..
      dockerfile: ChatApp.Server/Dockerfile
    container_name: chatapp_api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - avatar_data:/app/App_Data/avatars
      - attachment_data:/app/App_Data/attachments
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      EnableHttpsRedirection: "false"
      ConnectionStrings__DefaultConnection: Host=postgres_db;Port=5432;Database=${POSTGRES_DB:-ChatAppDatabase};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Pooling=true
      ConnectionStrings__Garnet: garnet_cache:6379,abortConnect=false
      Security__SecretEncryptionKey: ${Security__SecretEncryptionKey:?Set Security__SecretEncryptionKey}
      EmailSettings__Host: ${EmailSettings__Host:?Set EmailSettings__Host}
      EmailSettings__SenderEmail: ${EmailSettings__SenderEmail:?Set EmailSettings__SenderEmail}
      EmailSettings__Password: ${EmailSettings__Password:?Set EmailSettings__Password}
      ForwardedHeaders__KnownNetworks__0: 172.28.0.0/16
      ForwardedHeaders__KnownProxies__0: 127.0.0.1
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres_db:
        condition: service_healthy
      garnet_cache:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - chatapp_net

  reverse_proxy:
    image: nginx:1.27-alpine
    container_name: chatapp_nginx
    restart: unless-stopped
    ports:
      - "${CHATAPP_PROXY_PORT:-8080}:80"
      # TLS：取消注释并挂载 deploy/nginx/chatapp-tls.conf.template + 证书
      # - "${CHATAPP_PROXY_TLS_PORT:-8443}:443"
    environment:
      CHATAPP_UPSTREAM_HOST: api
      CHATAPP_UPSTREAM_PORT: "8080"
    volumes:
      - ./deploy/nginx/chatapp.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - chatapp_net

volumes:
  postgres_data:
  garnet_data:
  avatar_data:
  attachment_data:

networks:
  chatapp_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
