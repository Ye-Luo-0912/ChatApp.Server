# 本地联调覆盖：api/worker 以 Development 环境运行，绕过生产强制校验
# （Production 要求 HTTPS PhoneVerification:WebhookUrl 与 DataExport:Provider=S3）。
# 用法：
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml -f docker-compose.local.yaml up -d api
services:
  api:
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development

  worker:
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development